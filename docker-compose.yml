services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rest_api_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/rest_api_db
      PYTHONPATH: /app
    volumes:
      - .:/app

volumes:
  postgres_data: